<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Search</title>
</head>
<body>
    <h1>Image Search</h1>
    <form method="post">
        <input type="text" name="query" placeholder="Describe what you're looking for" value="{{ query }}" required>
        <button type="submit">Search</button>
    </form>
    {% if matches %}
        <h2>Matches</h2>
        <ul>
        {% for file in matches %}
            <li>
                <img src="{{ url_for('static', filename=file) }}" alt="{{ file }}" style="max-width:200px;"><br>
                {{ file }}
            </li>
        {% endfor %}
        </ul>
    {% elif request.method == 'POST' %}
        <p>No matches found.</p>
    {% endif %}
</body>
</html>
